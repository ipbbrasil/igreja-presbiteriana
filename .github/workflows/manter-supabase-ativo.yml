# Mantém o projeto gratuito do Supabase ativo.
# O Supabase pausa projetos gratuitos depois de 7 dias sem atividade.
# Todo dia de madrugada o GitHub (na nuvem, sem depender de nenhum computador)
# faz uma consulta pequena ao banco. Usa só a chave pública (a mesma de js/config.js);
# o RLS devolve lista vazia, mas a consulta conta como atividade.
# O job "religar" impede que o GitHub desligue este agendamento após 60 dias sem commit.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 em Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consultar o banco
        run: |
          curl -fsS --retry 3 --retry-delay 20 \
            "https://emrqtuvehkwngdnlhhjx.supabase.co/rest/v1/sinodos?select=id&limit=1" \
            -H "apikey: sb_publishable_ciXqN2rif1E3oH61b2AlqA_8e5QrgUJ"

  # O GitHub desliga os agendamentos de repositório público depois de 60 dias sem commit.
  # Religar pela API todo dia zera essa contagem, sem criar commit nenhum.
  # Religa os agendamentos ativos e os que o GitHub desligou por inatividade;
  # um desligado à mão (disabled_manually) continua desligado.
  religar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Religar os agendamentos
        run: |
          gh api "repos/$REPO/actions/workflows" --paginate \
            -q '.workflows[] | select(.state == "active" or .state == "disabled_inactivity") | .id' |
          while read -r id; do
            if gh api -X PUT "repos/$REPO/actions/workflows/$id/enable"; then echo "religado: $id"; else echo "nao religou: $id"; fi
          done
